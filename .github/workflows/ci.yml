name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a quiet repository still notices new stable-Rust breakage.
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ABACUS_NO_ACTIVITY: "1"

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The same command contributors and agents run locally, so the gate
      # cannot drift from the documented workflow. Bash exists on all three
      # runners; on Windows it is Git Bash.
      - run: ./scripts/validate.sh full
        shell: bash
